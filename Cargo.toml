[package]
name = "openmeteoapi_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "openmeteoapi_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-polars"]

[dependencies]
# Shared crates across all targets
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Python bindings (optional so Wasm builds ignore them)
pyo3 = { version = "0.29.0", features = ["extension-module"], optional = true }
pyo3-polars = { version = "0.28.0", optional = true }

# Native-only dependencies (Linux, macOS, Windows)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { version = "0.55.2", features = ["lazy", "strings", "temporal", "json"] }
reqwest = { version = "0.13.5", features = ["json", "blocking", "socks"] }
tokio = { version = "1.54.1", features = ["full"] }
